<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5b8c5a" />
  <title>Mon Safari à Thoiry 🦁</title>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <header class="app-header">
    <h1>🦁 Mon Safari à Thoiry</h1>
    <p class="subtitle">Touche les animaux que tu as vus !</p>
  </header>

  <main id="app"></main>

  <footer class="app-footer">
    <div class="score" id="score" aria-live="polite">
      <span class="score-count" id="score-count">0</span>
      <span class="score-label" id="score-label">animal vu</span>
    </div>
    <button id="say-all" class="btn btn-say">🔊 Dire mes animaux</button>
    <button id="reset" class="btn btn-reset">🔄 Recommencer</button>
  </footer>

  <!-- Fiche détaillée d'un animal -->
  <div id="detail" class="summary hidden" role="dialog" aria-modal="true">
    <div class="summary-card detail-card">
      <button class="summary-close" id="detail-close" aria-label="Fermer">✕</button>
      <div id="detail-thumb" class="detail-thumb"></div>
      <h2 id="detail-name"></h2>
      <p id="detail-desc" class="detail-desc"></p>
      <div class="detail-buttons">
        <button id="detail-read" class="btn btn-say">🔊 Réécouter</button>
      </div>
    </div>
  </div>

  <!-- Fenêtre de récapitulatif -->
  <div id="summary" class="summary hidden" role="dialog" aria-modal="true">
    <div class="summary-card">
      <button class="summary-close" id="summary-close" aria-label="Fermer">✕</button>
      <h2 id="summary-title">🎉 Bravo !</h2>
      <p id="summary-text"></p>
      <div class="summary-list" id="summary-list"></div>
    </div>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
